<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>KIconnect Chat</title>
    <meta name="name" content="KIconnect Chat" />
    <meta name="author" content="KIconnect" />
    <meta
      name="description"
      content="KIconnect Chat ist ein Matrix-basierter Kommunikationsclient auf Basis von Cinny."
    />
    <meta name="keywords" content="kiconnect, matrix, matrix client, cinny" />

    <meta property="og:title" content="KIconnect Chat" />
    <meta property="og:url" content="https://cinny.kiconnect.at" />
    <meta property="og:image" content="/kiconnect-logo.png" />
    <meta
      property="og:description"
      content="KIconnect Chat ist ein Matrix-basierter Kommunikationsclient auf Basis von Cinny."
    />
    <meta name="theme-color" content="#1E7F93" />

    <link
      id="favicon"
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/kiconnect-desktop-v2-32.png"
    />
    <link rel="icon" type="image/png" sizes="16x16" href="/kiconnect-desktop-v2-16.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/kiconnect-desktop-v2-48.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/kiconnect-desktop-v2-64.png" />

    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="KIconnect Chat" />
    <meta name="apple-mobile-web-app-title" content="KIconnect Chat" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="apple-touch-icon" sizes="180x180" href="/kiconnect-apple-touch-v6-180.png" />
  </head>
  <body id="appBody">
    <script>
      window.global ||= window;

      (() => {
        const lockPrefix = 'kiconnect.lock.v1.';
        const userId = localStorage.getItem('cinny_user_id');
        if (!userId) return;
        const accountType = localStorage.getItem(
          `kiconnect.account-type.v1.${encodeURIComponent(userId)}`
        );
        if (accountType === 'team') return;

        let locked = false;
        try {
          const lockKey = `${lockPrefix}${encodeURIComponent(userId)}`;
          locked = JSON.parse(localStorage.getItem(lockKey) || '{}').locked === true;
        } catch (_) {
          locked = true;
        }
        if (!locked) return;

        let unlockPending = false;
        try {
          const transaction = JSON.parse(
            localStorage.getItem('kiconnect.unlock.transaction.v1') || 'null'
          );
          unlockPending =
            typeof transaction?.createdAt === 'number' &&
            Date.now() - transaction.createdAt < 10 * 60 * 1000;
        } catch (_) {
          unlockPending = false;
        }

        const shell = document.createElement('div');
        shell.id = 'kiconnect-early-lock';
        shell.style.cssText =
          'position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;background:#f7fafb;color:#16343b;padding:24px;font-family:system-ui,sans-serif';
        shell.innerHTML =
          '<section style="width:min(100%,420px);text-align:center">' +
          '<img src="/kiconnect-lock-logo.png" alt="KI connect" width="112" height="112" style="object-fit:contain">' +
          '<h1 style="margin:16px 0 8px;font-size:28px">KI connect ist gesperrt</h1>' +
          '<p style="margin:0 0 24px;color:#527079">Entsperren Sie die App sicher mit Ihrem Passkey.</p>' +
          '<button id="kiconnect-early-unlock" type="button" style="width:100%;min-height:52px;border:0;border-radius:14px;background:#1e7f93;color:#fff;font-size:17px;font-weight:700;cursor:pointer;margin-bottom:12px">Client entsperren</button>' +
          '<p id="kiconnect-early-error" style="color:#922536;font-weight:600"></p>' +
          '</section>';
        document.body.prepend(shell);

        const showLoadingAfterUnlock = (record) => {
          if (record?.locked !== false) return;
          const heading = shell.querySelector('h1');
          const description = shell.querySelector('p');
          if (heading) heading.textContent = 'KI connect wird geladen …';
          if (description) description.textContent = 'Die sichere Anmeldung war erfolgreich.';
          const unlockButton = document.getElementById('kiconnect-early-unlock');
          if (unlockButton) unlockButton.remove();
        };
        window.addEventListener('storage', (event) => {
          if (!event.key?.startsWith(lockPrefix) || !event.newValue) return;
          try {
            showLoadingAfterUnlock(JSON.parse(event.newValue));
          } catch (_) {
            // Ignore malformed data; React keeps the secure lock screen visible.
          }
        });
        window.addEventListener('message', (event) => {
          if (
            event.origin === window.location.origin &&
            event.data?.type === 'kiconnect-unlock-success' &&
            typeof event.data?.idToken === 'string'
          ) {
            localStorage.setItem('kiconnect.unlock.id-token.v1', event.data.idToken);
          }
        });
        if (typeof BroadcastChannel === 'function') {
          const channel = new BroadcastChannel('kiconnect-lock-v1');
          channel.addEventListener('message', (event) => {
            if (typeof event.data?.idToken === 'string') {
              localStorage.setItem('kiconnect.unlock.id-token.v1', event.data.idToken);
            }
            showLoadingAfterUnlock(event.data);
          });
        }

        const button = document.getElementById('kiconnect-early-unlock');
        const error = document.getElementById('kiconnect-early-error');
        if (unlockPending) {
          const heading = shell.querySelector('h1');
          const description = shell.querySelector('p');
          if (heading) heading.textContent = 'Sichere Anmeldung wird geprüft …';
          if (description) description.textContent = 'Anschließend wird KI connect geladen.';
          button.disabled = true;
          button.textContent = 'Sichere Anmeldung läuft …';
        }
        const base64Url = (bytes) => {
          let binary = '';
          bytes.forEach((byte) => {
            binary += String.fromCharCode(byte);
          });
          return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
        };
        const random = (length = 32) => {
          const bytes = new Uint8Array(length);
          crypto.getRandomValues(bytes);
          return base64Url(bytes);
        };

        const createEarlyUnlockPreparation = async () => {
          const response = await fetch('/config.json', { cache: 'no-store' });
          if (!response.ok) throw new Error('Konfiguration konnte nicht geladen werden.');
          const config = await response.json();
          const expectedHostname = String(config.expectedHostname || '').toLowerCase();
          const actualHostname = location.hostname.toLowerCase();
          const loopback = ['localhost', '127.0.0.1', '::1'].includes(actualHostname);
          if (expectedHostname && actualHostname !== expectedHostname && !loopback) {
            throw new Error(
              `Falscher KIconnect-Build für ${actualHostname}; erwartet wird ${expectedHostname}.`
            );
          }
          const unlock = config.keycloakUnlock;
          if (!unlock?.issuer || !unlock.clientId) {
            throw new Error('Passkey-Entsperrung ist nicht konfiguriert.');
          }
          const issuer = unlock.issuer.replace(/\/$/, '');
          const origin = new URL(issuer).origin;
          if (!document.querySelector(`link[data-kiconnect-preconnect="${origin}"]`)) {
            const preconnect = document.createElement('link');
            preconnect.rel = 'preconnect';
            preconnect.href = origin;
            preconnect.crossOrigin = 'anonymous';
            preconnect.dataset.kiconnectPreconnect = origin;
            document.head.append(preconnect);
          }
          const codeVerifier = random(64);
          const digest = await crypto.subtle.digest(
            'SHA-256',
            new TextEncoder().encode(codeVerifier)
          );
          return {
            unlock,
            issuer,
            codeVerifier,
            codeChallenge: base64Url(new Uint8Array(digest)),
            state: random(),
            nonce: random(),
          };
        };
        let earlyUnlockPreparation = createEarlyUnlockPreparation();
        let earlyUnlockPreparedValue;
        earlyUnlockPreparation.then((value) => {
          earlyUnlockPreparedValue = value;
        });
        void earlyUnlockPreparation.catch(() => undefined);

        const createEarlyAuthorizeUrl = (prepared) => {
          const { unlock, issuer, codeChallenge, state, nonce } = prepared;
          const redirectUri = unlock.redirectUri || `${location.origin}/unlock/callback`;
          const authorizeUrl = new URL(`${issuer}/protocol/openid-connect/auth`);
          authorizeUrl.searchParams.set('client_id', unlock.clientId);
          authorizeUrl.searchParams.set('redirect_uri', redirectUri);
          authorizeUrl.searchParams.set('response_type', 'code');
          authorizeUrl.searchParams.set('scope', 'openid');
          authorizeUrl.searchParams.set('code_challenge_method', 'S256');
          authorizeUrl.searchParams.set('code_challenge', codeChallenge);
          authorizeUrl.searchParams.set('state', state);
          authorizeUrl.searchParams.set('nonce', nonce);
          authorizeUrl.searchParams.set('max_age', '0');
          authorizeUrl.searchParams.set('prompt', 'login');
          return { authorizeUrl, redirectUri };
        };

        const saveEarlyUnlockTransaction = (prepared, redirectUri, popup) => {
          localStorage.setItem(
            'kiconnect.unlock.transaction.v1',
            JSON.stringify({
              state: prepared.state,
              nonce: prepared.nonce,
              codeVerifier: prepared.codeVerifier,
              redirectUri,
              returnUrl: `${location.pathname}${location.search}${location.hash}`,
              createdAt: Date.now(),
              popup,
            })
          );
        };

        button.addEventListener('click', async () => {
          button.disabled = true;
          button.textContent = 'Sichere Anmeldung wird geöffnet …';
          const heading = shell.querySelector('h1');
          const description = shell.querySelector('p');
          if (heading) heading.textContent = 'Sichere Anmeldung wird geprüft …';
          if (description) description.textContent = 'Anschließend wird KI connect geladen.';
          error.textContent = '';
          const popupName = `kiconnect-passkey-unlock-${Date.now()}`;
          const popupFeatures = 'popup=yes,width=520,height=720,resizable=yes,scrollbars=yes';
          let popup;
          if (earlyUnlockPreparedValue) {
            const prepared = earlyUnlockPreparedValue;
            earlyUnlockPreparedValue = undefined;
            earlyUnlockPreparation = createEarlyUnlockPreparation();
            earlyUnlockPreparation.then((value) => {
              earlyUnlockPreparedValue = value;
            });
            void earlyUnlockPreparation.catch(() => undefined);
            const { authorizeUrl, redirectUri } = createEarlyAuthorizeUrl(prepared);
            saveEarlyUnlockTransaction(prepared, redirectUri, true);
            popup = window.open(authorizeUrl.toString(), popupName, popupFeatures);
            if (popup) {
              popup.focus();
              return;
            }
            saveEarlyUnlockTransaction(prepared, redirectUri, false);
            location.assign(authorizeUrl.toString());
            return;
          }

          popup = window.open('', popupName, popupFeatures);
          if (popup) {
            popup.document.head.innerHTML =
              '<meta name="viewport" content="width=device-width,initial-scale=1">' +
              '<title>KI connect – Sichere Anmeldung</title>';
            popup.document.body.style.cssText =
              'margin:0;min-height:100vh;display:grid;place-items:center;padding:36px;box-sizing:border-box;text-align:center;font:24px system-ui,sans-serif;background:#f7fafb;color:#16343b';
            popup.document.body.innerHTML =
              '<main><h1 style="margin:0 0 18px;font-size:36px;line-height:1.2">Sichere Anmeldung</h1>' +
              '<p style="margin:0;color:#527079;font-size:24px;line-height:1.5">Sie werden zur sicheren Anmeldung weitergeleitet …</p></main>';
          }
          try {
            const prepared = await earlyUnlockPreparation;
            earlyUnlockPreparation = createEarlyUnlockPreparation();
            earlyUnlockPreparation.then((value) => {
              earlyUnlockPreparedValue = value;
            });
            void earlyUnlockPreparation.catch(() => undefined);
            const { authorizeUrl, redirectUri } = createEarlyAuthorizeUrl(prepared);
            saveEarlyUnlockTransaction(prepared, redirectUri, Boolean(popup));
            if (popup) popup.location.replace(authorizeUrl.toString());
            else location.assign(authorizeUrl.toString());
          } catch (reason) {
            earlyUnlockPreparation = createEarlyUnlockPreparation();
            void earlyUnlockPreparation.catch(() => undefined);
            popup?.close();
            button.disabled = false;
            button.textContent = 'Client entsperren';
            error.textContent =
              reason instanceof Error ? reason.message : 'Entsperren fehlgeschlagen.';
          }
        });
      })();
    </script>
    <div id="root"></div>
    <div id="portalContainer"></div>
    <script type="module" src="./src/index.tsx"></script>
  </body>
</html>
